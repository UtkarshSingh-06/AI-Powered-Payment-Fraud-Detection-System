global:
  scrape_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  - job_name: fraudshield-backend
    static_configs:
      - targets: ['backend:5000']
    metrics_path: /api/metrics

  - job_name: fraudshield-inference
    static_configs:
      - targets: ['inference:8000']
    metrics_path: /metrics

  - job_name: fraudshield-api-gateway
    static_configs:
      - targets: ['api-gateway:8080']
    metrics_path: /health
