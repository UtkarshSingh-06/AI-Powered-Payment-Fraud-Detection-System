name: Deploy Staging

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Terraform plan (AWS)
        run: |
          cd infra/terraform/aws
          terraform init -backend=false || true
          terraform validate || true
      - name: Helm dry-run
        run: |
          echo "Helm deploy to staging EKS — configure kubeconfig in repository secrets"
