name: FraudShield CI/CD

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
        working-directory: packages/contracts
      - run: npm test
        working-directory: packages/contracts

  backend-tests:
    runs-on: ubuntu-latest
    needs: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm install
        working-directory: packages/contracts
      - run: npm install
        working-directory: backend
      - run: npm test
        working-directory: backend
        env:
          NODE_ENV: test
          JWT_SECRET: ci-test-jwt-secret-minimum-32-characters-long

  inference-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
        working-directory: services/inference-fastapi
      - run: pytest -q
        working-directory: services/inference-fastapi

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  nextjs-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web

  docker-images:
    runs-on: ubuntu-latest
    needs: [backend-tests, inference-tests, frontend-build]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t fraudshield/backend:latest ./backend
      - name: Build api-gateway image
        run: docker build -t fraudshield/api-gateway:latest ./apps/api-gateway
      - name: Build inference image
        run: docker build -t fraudshield/inference:latest ./services/inference-fastapi

  integration-compose:
    runs-on: ubuntu-latest
    needs: docker-images
    steps:
      - uses: actions/checkout@v4
      - name: Compose smoke test
        run: |
          docker compose up -d postgres redis redpanda inference backend
          sleep 30
          curl -fsS http://localhost:5000/api/health
          curl -fsS http://localhost:8000/health
