name: FraudShield CI/CD

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
        working-directory: packages/contracts
      - run: npm test
        working-directory: packages/contracts

  backend-tests:
    runs-on: ubuntu-latest
    needs: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm install
        working-directory: packages/contracts
      - run: npm install
        working-directory: backend
      - run: npm test
        working-directory: backend
        env:
          NODE_ENV: test
          JWT_SECRET: ci-test-jwt-secret-minimum-32-characters-long

  inference-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
        working-directory: services/inference-fastapi
      - run: pytest -q
        working-directory: services/inference-fastapi

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  nextjs-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web

  docker-images:
    runs-on: ubuntu-latest
    needs: [backend-tests, inference-tests, frontend-build]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t fraudshield/backend:latest ./backend
      - name: Build api-gateway image
        run: docker build -t fraudshield/api-gateway:latest ./apps/api-gateway
      - name: Build inference image
        run: docker build -t fraudshield/inference:latest ./services/inference-fastapi
      - name: Train model artifact
        run: |
          pip install numpy pandas scikit-learn xgboost joblib
          python ml/training/train.py
      - name: Push to registry (when configured)
        if: ${{ secrets.ECR_REGISTRY != '' }}
        run: |
          echo "${{ secrets.ECR_PASSWORD }}" | docker login -u "${{ secrets.ECR_USERNAME }}" --password-stdin "${{ secrets.ECR_REGISTRY }}"
          docker tag fraudshield/backend:latest ${{ secrets.ECR_REGISTRY }}/fraudshield/backend:${{ github.sha }}
          docker push ${{ secrets.ECR_REGISTRY }}/fraudshield/backend:${{ github.sha }}

  e2e-smoke:
    runs-on: ubuntu-latest
    needs: frontend-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install && npm run build
        working-directory: frontend
      - run: npm install && npx playwright install chromium
        working-directory: tests/e2e
      - name: Run smoke tests
        working-directory: tests/e2e
        run: |
          cd ../../frontend && npm run preview -- --host 127.0.0.1 --port 4173 &
          sleep 5
          npx playwright test
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173

  load-test:
    runs-on: ubuntu-latest
    needs: integration-compose
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: grafana/k6-action@v0.3.1
        with:
          filename: tests/load/k6-score.js
        env:
          API_URL: http://localhost:5000

  integration-compose:
    runs-on: ubuntu-latest
    needs: docker-images
    steps:
      - uses: actions/checkout@v4
      - name: Compose smoke test
        run: |
          docker compose up -d postgres redis redpanda inference backend
          sleep 30
          curl -fsS http://localhost:5000/api/health
          curl -fsS http://localhost:8000/health
