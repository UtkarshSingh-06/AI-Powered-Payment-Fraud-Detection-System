name: FraudShield CI/CD

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm test --workspace=@fraudshield/contracts

  backend-tests:
    runs-on: ubuntu-latest
    needs: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Install Rollup native binding for Vitest
        run: npm install @rollup/rollup-linux-x64-gnu@4.60.1 -w fraudshield-ai-backend
      - run: npm test --workspace=fraudshield-ai-backend
        env:
          NODE_ENV: test
          JWT_SECRET: ci-test-jwt-secret-minimum-32-characters-long
          DATABASE_URL: ''
          MFA_DEV_BYPASS: 'true'

  inference-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: services/inference-fastapi/requirements.txt
      - run: pip install -r requirements.txt
        working-directory: services/inference-fastapi
      - run: pytest -q
        working-directory: services/inference-fastapi

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install and build frontend
        working-directory: frontend
        run: |
          npm install
          npm install @rollup/rollup-linux-x64-gnu@4.60.1 \
            lightningcss-linux-x64-gnu@1.30.2 \
            @tailwindcss/oxide-linux-x64-gnu@4.1.18
          npm run build

  nextjs-build:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web

  docker-images:
    runs-on: ubuntu-latest
    needs: [inference-tests, frontend-build]
    if: always() && needs.inference-tests.result == 'success' && needs.frontend-build.result == 'success'
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -f backend/Dockerfile -t fraudshield/backend:latest .
      - name: Build api-gateway image
        run: docker build -f apps/api-gateway/Dockerfile -t fraudshield/api-gateway:latest .
      - name: Build inference image
        run: docker build -f services/inference-fastapi/Dockerfile -t fraudshield/inference:latest .
      - name: Train model artifact
        run: |
          pip install numpy pandas scikit-learn xgboost joblib
          python ml/training/train.py
      - name: Push to registry (optional)
        env:
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
          ECR_USERNAME: ${{ secrets.ECR_USERNAME }}
          ECR_PASSWORD: ${{ secrets.ECR_PASSWORD }}
        run: |
          if [ -z "$ECR_REGISTRY" ]; then
            echo "ECR_REGISTRY not configured — skipping push"
            exit 0
          fi
          echo "$ECR_PASSWORD" | docker login -u "$ECR_USERNAME" --password-stdin "$ECR_REGISTRY"
          docker tag fraudshield/backend:latest "$ECR_REGISTRY/fraudshield/backend:${GITHUB_SHA}"
          docker push "$ECR_REGISTRY/fraudshield/backend:${GITHUB_SHA}"

  e2e-smoke:
    runs-on: ubuntu-latest
    needs: frontend-build
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Build frontend for e2e
        working-directory: frontend
        run: |
          npm install
          npm install @rollup/rollup-linux-x64-gnu@4.60.1 \
            lightningcss-linux-x64-gnu@1.30.2 \
            @tailwindcss/oxide-linux-x64-gnu@4.1.18
          npm run build
      - run: npm install
        working-directory: tests/e2e
      - run: npx playwright install chromium --with-deps
        working-directory: tests/e2e
      - name: Run smoke tests
        run: |
          cd frontend
          npm run preview -- --host 127.0.0.1 --port 4173 &
          PREVIEW_PID=$!
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:4173/ || (echo "Vite preview failed to start" && kill $PREVIEW_PID 2>/dev/null; exit 1)
          cd ../tests/e2e
          npx playwright test
          kill $PREVIEW_PID 2>/dev/null || true
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173

  integration-compose:
    runs-on: ubuntu-latest
    needs: docker-images
    steps:
      - uses: actions/checkout@v4
      - name: Create CI env file for Compose
        run: |
          printf '%s\n' \
            'JWT_SECRET=ci-test-jwt-secret-minimum-32-characters-long' \
            'NODE_ENV=production' > backend/.env
      - name: Compose smoke test
        run: |
          docker compose up -d postgres redis redpanda inference backend --build
          for i in $(seq 1 36); do
            if curl -fsS http://localhost:5000/api/health >/dev/null 2>&1 \
              && curl -fsS http://localhost:8000/health >/dev/null 2>&1; then
              exit 0
            fi
            sleep 10
          done
          echo "Services did not become healthy in time"
          docker compose ps
          docker compose logs backend inference --tail 80
          exit 1

  load-test:
    runs-on: ubuntu-latest
    needs: integration-compose
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: grafana/k6-action@v0.3.1
        with:
          filename: tests/load/k6-score.js
        env:
          API_URL: http://localhost:5000
