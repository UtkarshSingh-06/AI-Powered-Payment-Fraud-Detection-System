version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: fraudshield-postgres
    environment:
      - POSTGRES_DB=fraudshield
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fraudshield-network

  redis:
    image: redis:7-alpine
    container_name: fraudshield-redis
    ports:
      - "6379:6379"
    networks:
      - fraudshield-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: fraudshield-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - fraudshield-network

  redpanda:
    image: redpandadata/redpanda:v24.2.4
    container_name: fraudshield-redpanda
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 1G
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:9092
    ports:
      - "9092:9092"
    networks:
      - fraudshield-network

  inference:
    build:
      context: .
      dockerfile: services/inference-fastapi/Dockerfile
    container_name: fraudshield-inference
    ports:
      - "8000:8000"
    environment:
      - MODEL_ARTIFACT_PATH=/app/models/xgboost-fraud.joblib
    networks:
      - fraudshield-network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: fraudshield-backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - JWT_SECRET=${JWT_SECRET:-change-this-secret-in-production}
      - JWT_EXPIRES_IN=7d
      - CORS_ORIGIN=http://localhost:3002,http://localhost:3000
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/fraudshield
      - REDIS_URL=redis://redis:6379
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
      - KAFKA_BROKERS=redpanda:9092
      - KAFKA_TOPIC_transactions.ingested=transactions.ingested
      - KAFKA_TOPIC_fraud.decisions=fraud.decisions
      - KAFKA_TOPIC_fraud.labels=fraud.labels
      - INFERENCE_URL=http://inference:8000
      - AML_SERVICE_URL=http://aml-service:5007
      - CASE_SERVICE_URL=http://case-service:5004
      - GATEWAY_INTERNAL_SECRET=${JWT_SECRET:-change-this-secret-in-production}
      - WS_REQUIRE_AUTH=true
      - KAFKA_DLQ_TOPIC=platform.dlq
    env_file:
      - ./backend/.env
    depends_on:
      - postgres
      - redis
      - rabbitmq
      - redpanda
      - inference
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - fraudshield-network

  api-gateway:
    build:
      context: .
      dockerfile: apps/api-gateway/Dockerfile
    container_name: fraudshield-api-gateway
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - JWT_SECRET=${JWT_SECRET:-change-this-secret-in-production}
      - GATEWAY_INTERNAL_SECRET=${JWT_SECRET:-change-this-secret-in-production}
      - BACKEND_URL=http://backend:5000
      - AUTH_SERVICE_URL=http://auth-service:5001
      - INGESTION_SERVICE_URL=http://ingestion-service:5002
      - SCORING_SERVICE_URL=http://scoring-service:5003
      - CASE_SERVICE_URL=http://case-service:5004
      - RULES_ENGINE_URL=http://rules-engine:5005
      - NOTIFICATION_SERVICE_URL=http://notification-service:5006
      - AML_SERVICE_URL=http://aml-service:5007
      - SANDBOX_SERVICE_URL=http://sandbox-simulator:5008
    depends_on:
      - backend
      - auth-service
      - ingestion-service
      - scoring-service
      - case-service
      - rules-engine
      - notification-service
      - aml-service
    networks:
      - fraudshield-network

  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: fraudshield-auth-service
    environment:
      - PORT=5001
      - BACKEND_URL=http://backend:5000
      - JWT_SECRET=${JWT_SECRET:-change-this-secret-in-production}
    networks:
      - fraudshield-network

  ingestion-service:
    build:
      context: .
      dockerfile: services/ingestion-service/Dockerfile
    container_name: fraudshield-ingestion-service
    environment:
      - PORT=5002
      - BACKEND_URL=http://backend:5000
      - KAFKA_BROKERS=redpanda:9092
      - JWT_SECRET=${JWT_SECRET:-change-this-secret-in-production}
      - GATEWAY_INTERNAL_SECRET=${JWT_SECRET:-change-this-secret-in-production}
    depends_on:
      - redpanda
      - backend
    networks:
      - fraudshield-network

  scoring-service:
    build:
      context: .
      dockerfile: services/scoring-service/Dockerfile
    container_name: fraudshield-scoring-service
    environment:
      - PORT=5003
      - INFERENCE_URL=http://inference:8000
      - RULES_ENGINE_URL=http://rules-engine:5005
      - JWT_SECRET=${JWT_SECRET:-change-this-secret-in-production}
      - GATEWAY_INTERNAL_SECRET=${JWT_SECRET:-change-this-secret-in-production}
    depends_on:
      - inference
      - rules-engine
    networks:
      - fraudshield-network

  case-service:
    build:
      context: .
      dockerfile: services/case-service/Dockerfile
    container_name: fraudshield-case-service
    environment:
      - PORT=5004
      - BACKEND_URL=http://backend:5000
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/fraudshield
      - JWT_SECRET=${JWT_SECRET:-change-this-secret-in-production}
      - GATEWAY_INTERNAL_SECRET=${JWT_SECRET:-change-this-secret-in-production}
    depends_on:
      - postgres
      - backend
    networks:
      - fraudshield-network

  rules-engine:
    build:
      context: .
      dockerfile: services/rules-engine/Dockerfile
    container_name: fraudshield-rules-engine
    environment:
      - PORT=5005
      - JWT_SECRET=${JWT_SECRET:-change-this-secret-in-production}
      - GATEWAY_INTERNAL_SECRET=${JWT_SECRET:-change-this-secret-in-production}
    networks:
      - fraudshield-network

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    container_name: fraudshield-notification-service
    environment:
      - PORT=5006
      - KAFKA_BROKERS=redpanda:9092
      - JWT_SECRET=${JWT_SECRET:-change-this-secret-in-production}
      - GATEWAY_INTERNAL_SECRET=${JWT_SECRET:-change-this-secret-in-production}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - ALERT_WEBHOOK_URL=${ALERT_WEBHOOK_URL:-}
    depends_on:
      - redpanda
    networks:
      - fraudshield-network

  aml-service:
    build:
      context: .
      dockerfile: services/aml-service/Dockerfile
    container_name: fraudshield-aml-service
    environment:
      - PORT=5007
      - JWT_SECRET=${JWT_SECRET:-change-this-secret-in-production}
      - GATEWAY_INTERNAL_SECRET=${JWT_SECRET:-change-this-secret-in-production}
      - AML_VENDOR_URL=${AML_VENDOR_URL:-}
    networks:
      - fraudshield-network

  sandbox-simulator:
    build:
      context: .
      dockerfile: services/sandbox-simulator/Dockerfile
    container_name: fraudshield-sandbox-simulator
    environment:
      - PORT=5008
      - BACKEND_URL=http://backend:5000
      - INGESTION_URL=http://ingestion-service:5002
      - JWT_SECRET=${JWT_SECRET:-change-this-secret-in-production}
      - GATEWAY_INTERNAL_SECRET=${JWT_SECRET:-change-this-secret-in-production}
    depends_on:
      - ingestion-service
      - backend
    networks:
      - fraudshield-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:8080/api}
        - VITE_WS_URL=${VITE_WS_URL:-ws://localhost:5000/ws}
    container_name: fraudshield-frontend
    ports:
      - "3002:80"
    depends_on:
      - api-gateway
    restart: unless-stopped
    networks:
      - fraudshield-network

  feature-pipeline:
    image: python:3.11-slim
    container_name: fraudshield-feature-pipeline
    working_dir: /app
    command: sh -c "pip install --no-cache-dir -r requirements.txt && python kafka_worker.py"
    volumes:
      - ./services/feature-pipeline:/app
    environment:
      - REDIS_URL=redis://redis:6379/0
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/%2F
      - KAFKA_BROKERS=redpanda:9092
      - KAFKA_TOPIC_TRANSACTIONS=transactions.ingested
    depends_on:
      - redis
      - redpanda
    networks:
      - fraudshield-network

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: fraudshield-prometheus
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./infra/monitoring/alert-rules.yml:/etc/prometheus/alert-rules.yml
    ports:
      - "9090:9090"
    networks:
      - fraudshield-network

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: fraudshield-alertmanager
    volumes:
      - ./infra/monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    ports:
      - "9093:9093"
    networks:
      - fraudshield-network

  otel-collector:
    image: otel/opentelemetry-collector:0.111.0
    container_name: fraudshield-otel
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./infra/otel/collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"
    networks:
      - fraudshield-network

  grafana:
    image: grafana/grafana:11.2.0
    container_name: fraudshield-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./infra/monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
    networks:
      - fraudshield-network

networks:
  fraudshield-network:
    driver: bridge

volumes:
  postgres_data:
