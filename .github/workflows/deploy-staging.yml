name: Deploy Staging

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform plan (AWS)
        run: |
          cd infra/terraform/aws
          terraform init -backend=false || true
          terraform validate
      - name: Helm dry-run
        run: |
          helm template fraudshield infra/k8s/helm/fraudshield \
            --set image.tag=staging \
            --namespace fraudshield-staging > /tmp/manifest.yaml
          test -s /tmp/manifest.yaml
      - name: k6 smoke (optional)
        if: vars.STAGING_API_URL != ''
        uses: grafana/k6-action@v0.3.1
        with:
          filename: tests/load/k6-score.js
        env:
          API_URL: ${{ vars.STAGING_API_URL }}
